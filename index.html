<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Menu</title>
<meta name="description" content="Every chat command, redeem and game on the stream — click to copy, paste in chat, cause problems.">
<meta name="theme-color" content="#040604">
<meta property="og:title" content="drewdj45 — Stream Menu">
<meta property="og:description" content="Every command, redeem and game. Click any command to copy it.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #040604;        /* Ink */
    --card: #0C600A;      /* Deep */
    --card2: #596B0A;     /* Olive */
    --text: #E2EAD4;      /* Bone */
    --muted: #647C54;     /* Sage */
    --accent: #2BA61E;    /* Green */
    --accent2: #CCCD25;   /* Chartreuse */
    --amber: #946606;     /* Amber */
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    background-image: radial-gradient(800px 420px at 50% -120px, rgba(43,166,30,.10), transparent 70%);
    color: var(--text);
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- CRT scanlines (delete this whole rule if it's too much) ---------- */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 999;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 1px, transparent 3px);
  }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 80px; }
  .hidden { display: none !important; }

  /* ---------- header ---------- */
  header { text-align: center; padding: 40px 0 12px; }
  header h1 {
    font-family: 'VT323', monospace;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 10px rgba(43,166,30,0.4);
  }
  header h1 span { color: var(--accent2); }
  .cursor { color: var(--accent2); animation: blink 1.1s steps(1) infinite; font-weight: 700; }
  @keyframes blink { 50% { opacity: 0; } }
  .updated { color: var(--muted); font-size: 0.9rem; margin-top: 8px; letter-spacing: 0.5px; }

  .links { margin-top: 18px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .links a {
    color: var(--accent2); text-decoration: none; font-size: 0.95rem;
    border: 1px solid var(--accent2); background: transparent;
    padding: 6px 16px; border-radius: 4px; transition: all 0.2s;
  }
  .links a:hover { background: var(--accent2); color: var(--bg); box-shadow: 0 0 14px rgba(204,205,37,.35); }

  .intro {
    background: var(--card); border: 1px solid var(--muted); border-left: 4px solid var(--amber);
    border-radius: 8px; padding: 20px 24px; margin-top: 24px;
    font-size: 1rem; text-align: left; color: var(--text);
  }
  .intro b { color: var(--accent2); }

  /* ---------- controls ---------- */
  .controls {
    position: sticky; top: 0; z-index: 10; padding: 16px 0 14px;
    background: rgba(4, 6, 4, 0.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card2); margin-top: 24px;
  }
  #search {
    width: 100%; padding: 12px 16px; border-radius: 6px;
    border: 1px solid var(--muted); background: var(--card); color: var(--text);
    font-family: inherit; font-size: 1rem; transition: border-color 0.2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--accent2); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    padding: 6px 14px; border-radius: 4px; border: 1px solid var(--card2);
    background: var(--card); color: var(--muted); cursor: pointer;
    font-family: inherit; font-size: 0.85rem; transition: all 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent2); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }

  /* 12 categories — scroll instead of wrap on phones */
  @media (max-width: 640px) {
    .chips { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; }
  }

  /* ---------- sections & cards ---------- */
  h2 {
    margin: 36px 0 16px; font-size: 1.4rem; color: var(--accent);
    border-bottom: 1px solid var(--card2); padding-bottom: 8px;
    text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: baseline; gap: 12px;
    font-family: 'VT323', monospace;
  }
  h2 .count { color: var(--muted); font-size: 0.9rem; font-weight: 400; letter-spacing: 0; text-transform: none; font-family: 'Share Tech Mono', monospace; }

  .note {
    background: var(--bg); border: 1px dashed var(--muted); color: var(--text);
    font-size: 0.9rem; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px;
  }
  .note b { color: var(--accent2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--card2); border-radius: 6px;
    padding: 16px 18px; transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.45); }
  .card.disabled { opacity: 0.4; filter: grayscale(100%); }
  .card.disabled:hover { transform: none; border-color: var(--card2); box-shadow: none; }

  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .name {
    font-weight: 700; cursor: pointer; color: var(--text);
    user-select: none; word-break: break-word;
    transition: color 0.15s, text-shadow 0.15s;
  }
  .name:hover { color: var(--accent2); text-shadow: 0 0 10px rgba(204,205,37,0.45); }
  .name.copied { color: var(--accent2); text-shadow: 0 0 12px rgba(204,205,37,0.6); }
  .card.disabled .name { cursor: default; }
  .card.disabled .name:hover { color: var(--text); text-shadow: none; }
  .name:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  .cost { color: var(--accent2); font-weight: 700; white-space: nowrap; font-size: 0.95rem; }
  .cost.free { color: var(--accent); }
  .cost.tbc { color: var(--muted); font-weight: 400; }

  .desc { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 12px; }

  .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; align-items: center; }
  .badge { padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; font-size: 0.7rem; }
  .b-new { background: var(--accent); color: var(--bg); }
  .b-updated { background: var(--amber); color: var(--text); }
  .b-disabled { background: var(--muted); color: var(--bg); }
  .b-mod { background: var(--amber); color: var(--bg); }
  .b-vip { background: var(--accent2); color: var(--bg); }
  .b-broadcaster { background: var(--text); color: var(--bg); }
  .b-off { background: var(--card2); color: var(--text); }
  .cool { background: var(--card2); color: var(--text); padding: 2px 8px; border-radius: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 1rem; }

  /* ---------- changelog & footer ---------- */
  .change { background: var(--card); border: 1px solid var(--card2); border-radius: 8px; padding: 16px 20px; }
  .change li { margin-left: 20px; color: var(--muted); margin-top: 6px; font-size: 0.95rem; }
  .change .date { color: var(--text); font-weight: 700; }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 56px; line-height: 2; }
  footer b { color: var(--accent2); }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="updated" id="updated"></div>
    <div class="links" id="links"></div>
    <div class="intro" id="intro" style="display:none"></div>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="Search commands...  (press /)" autocomplete="off" spellcheck="false">
    <div class="chips" id="chips"></div>
  </div>

  <main id="menu"></main>
  <p class="empty hidden" id="empty">No commands found. Try fewer letters, gremlin.</p>

  <h2>Recent Updates</h2>
  <div class="change"><ul id="changelog"></ul></div>

  <footer>
    Type <b>!c</b> or <b>!command</b> in chat for the quick version<br>
    No backend • No trackers • Edit <b>data.js</b> • Time to Gamer bruhmane
  </footer>
</div>

<script src="data.js"></script>
<script>
const data = window.MENU;
const menuEl = document.getElementById('menu');
const searchEl = document.getElementById('search');
const emptyEl = document.getElementById('empty');

/* ---------- header ---------- */
document.getElementById('title').innerHTML =
  `${data.streamer}'s <span>Stream Menu</span><span class="cursor">_</span>`;
document.title = `${data.streamer} — Stream Menu`;
document.getElementById('updated').textContent = `Last updated: ${data.updated}`;

(data.links || []).forEach(l => {
  const a = document.createElement('a');
  a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = l.label;
  document.getElementById('links').appendChild(a);
});

if (data.intro) {
  const el = document.getElementById('intro');
  el.innerHTML = data.intro;
  el.style.display = 'block';
}

/* ---------- chips ---------- */
let activeSection = "All";
const chipsEl = document.getElementById('chips');
["All", ...data.sections.map(s => s.name)].forEach(name => {
  const b = document.createElement('button');
  b.className = 'chip' + (name === "All" ? ' active' : '');
  b.textContent = name;
  b.dataset.filter = name;
  b.onclick = () => {
    activeSection = name;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === name));
    render();
  };
  chipsEl.appendChild(b);
});

/* ---------- badges: auto-detect Mod Only / Offline from the description ---------- */
function badge(it) {
  if (it.status === 'new')      return '<span class="badge b-new">New</span>';
  if (it.status === 'updated')  return '<span class="badge b-updated">Updated</span>';
  if (it.status === 'disabled') {
    const d = (it.desc || '').toLowerCase();
    if (d.includes('broadcaster')) return '<span class="badge b-broadcaster">Broadcaster</span>';
    if (d.includes('mod'))         return '<span class="badge b-mod">Mod Only</span>';
    if (d.includes('vip'))         return '<span class="badge b-vip">VIP+</span>';
    if (d.includes('offline'))     return '<span class="badge b-off">Offline</span>';
    return '<span class="badge b-disabled">Soon™</span>';
  }
  return '';
}

/* ---------- render ---------- */
function render() {
  const q = searchEl.value.trim().toLowerCase();
  menuEl.innerHTML = '';
  let visible = 0;

  data.sections.forEach(sec => {
    if (activeSection !== "All" && sec.name !== activeSection) return;
    /* search matches command, description AND section name */
    const items = (sec.items || []).filter(it => {
      if (!q) return true;
      const hay = (it.name + ' ' + (it.desc || '') + ' ' + sec.name).toLowerCase();
      return hay.includes(q);
    });
    if (!items.length) return;

    const h = document.createElement('h2');
    h.innerHTML = `${sec.name} <span class="count">${items.length}</span>`;
    menuEl.appendChild(h);

    if (sec.note) {
      const n = document.createElement('div');
      n.className = 'note';
      n.innerHTML = sec.note;
      menuEl.appendChild(n);
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(it => {
      const costStr = String(it.cost);
      const isFree = costStr.toUpperCase() === 'FREE';
      const isTBC = costStr === '?';
      /* "!sr ID/Title" -> "!sr" | "!fire A3" -> "!fire" | "!hangman / !hm" -> "!hangman" */
      const copyCmd = it.name.split(/[\s\/]/)[0];
      const costHtml = isTBC
        ? '<span class="cost tbc">TBC</span>'
        : `<span class="cost${isFree ? ' free' : ''}">${isFree ? 'FREE' : '🥚 ' + costStr}</span>`;
      const card = document.createElement('div');
      card.className = 'card' + (it.status === 'disabled' ? ' disabled' : '');
      card.innerHTML = `<div class="card-top"><span class="name" role="button" tabindex="${it.status === 'disabled' ? '-1' : '0'}" data-copy="${copyCmd}" title="Click to copy ${copyCmd}">${it.name}</span>${costHtml}</div>
        <div class="desc">${it.desc || ''}</div>
        <div class="meta">${badge(it)}${it.cooldown ? `<span class="cool">⏱ ${it.cooldown}</span>` : ''}</div>`;
      grid.appendChild(card);
      visible++;
    });
    menuEl.appendChild(grid);
  });

  emptyEl.classList.toggle('hidden', visible > 0);
}
render();
searchEl.addEventListener('input', render);

/* ---------- click-to-copy (event delegation, mouse + keyboard) ---------- */
function triggerCopy(el) {
  if (el.classList.contains('copied')) return;
  const original = el.textContent;
  copyText(el.dataset.copy).then(() => {
    el.textContent = 'Copied! ✓';
    el.classList.add('copied');
    setTimeout(() => { el.textContent = original; el.classList.remove('copied'); }, 1200);
  }).catch(() => {
    el.textContent = 'Copy failed :(';
    el.classList.add('copied');
    setTimeout(() => { el.textContent = original; el.classList.remove('copied'); }, 1200);
  });
}

menuEl.addEventListener('click', e => {
  const el = e.target.closest('.name');
  if (!el || el.closest('.card.disabled')) return;
  triggerCopy(el);
});

menuEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.classList && e.target.classList.contains('name') ? e.target : null;
  if (!el || el.closest('.card.disabled')) return;
  e.preventDefault();
  triggerCopy(el);
});

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  /* fallback for file:// preview */
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
}

/* ---------- keyboard: "/" focuses search, Esc clears ---------- */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
});
searchEl.addEventListener('keydown', e => {
  if (e.key === 'Escape' && searchEl.value) { searchEl.value = ''; render(); }
});

/* ---------- changelog ---------- */
const cl = document.getElementById('changelog');
(data.changelog || []).forEach(c => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="date">${c.date}</span> — ${c.text}`;
  cl.appendChild(li);
});
</script>
</body>
</html>
