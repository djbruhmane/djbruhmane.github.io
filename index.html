<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Menu</title>
<meta name="description" content="Every chat command, redeem and game on drewdj45's stream — click to copy, paste in chat, cause problems.">
<meta name="theme-color" content="#0d0812">
<meta property="og:title" content="drewdj45 — Stream Menu">
<meta property="og:description" content="Every command, redeem and game. Click any command to copy it. 🎃">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Creepster&display=swap" rel="stylesheet">
<style>
  :root {
    /* Gothic Halloween Palette */
    --bg: #0d0812;        /* Midnight */
    --card: #160f1c;      /* Darkest Purple */
    --card2: #36264a;     /* Witch Purple (Borders) */
    --text: #e2e8d8;      /* Bone */
    --muted: #8e9e8a;     /* Pallid Green */
    --accent: #b83e3e;    /* Blood Red */
    --accent2: #e88a1a;   /* Pumpkin Orange */
    --amber: #f0b429;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 50% -10%, #2a0f1b 0%, var(--bg) 70%);
    color: var(--text); 
    font-family: 'Share Tech Mono', ui-monospace, monospace; 
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 80px; }
  .hidden { display: none !important; }

  /* ---------- header ---------- */
  header { text-align: center; padding: 40px 0 12px; }
  header h1 { 
    font-family: 'Creepster', cursive;
    font-size: clamp(2.5rem, 6vw, 4rem); 
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    text-shadow: 0 0 10px rgba(184, 62, 62, 0.6);
  }
  header h1 span { color: var(--accent); }
  .cursor { color: var(--accent); animation: blink 1.1s steps(1) infinite; font-weight: 700; }
  @keyframes blink { 50% { opacity: 0; } }
  .updated { color: var(--muted); font-size: 0.95rem; margin-top: 8px; letter-spacing: 0.5px; }
  
  .links { margin-top: 18px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .links a { 
    color: var(--accent2); 
    text-decoration: none; 
    font-size: 1rem; 
    border: 1px solid var(--accent2); 
    background: transparent;
    padding: 6px 16px; 
    border-radius: 4px; 
    transition: background 0.2s, color 0.2s; 
  }
  .links a:hover { 
    background: var(--accent2); 
    color: var(--bg);
  }
  
  .intro { 
    background: var(--card); 
    border: 1px solid var(--accent); 
    border-left: 4px solid var(--accent); 
    border-radius: 6px; 
    padding: 20px 24px; 
    margin-top: 24px; 
    font-size: 1.05rem; 
    text-align: left; 
    color: var(--text);
  }
  .intro b { color: var(--accent2); }

  /* ---------- controls ---------- */
  .controls { 
    position: sticky; 
    top: 0; 
    z-index: 10; 
    padding: 16px 0 14px;
    background: var(--bg); 
    border-bottom: 1px solid var(--card2); 
    margin-top: 24px;
  }
  #search { 
    width: 100%; 
    padding: 12px 16px; 
    border-radius: 4px; 
    border: 1px solid var(--muted); 
    background: var(--card); 
    color: var(--text); 
    font-family: inherit;
    font-size: 1.05rem; 
    transition: border-color 0.2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--accent2); }
  
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { 
    padding: 6px 14px; 
    border-radius: 4px; 
    border: 1px solid var(--card2); 
    background: var(--card); 
    color: var(--text); 
    cursor: pointer; 
    font-family: inherit;
    font-size: 0.9rem; 
    transition: all 0.15s; 
  }
  .chip:hover { border-color: var(--accent2); }
  .chip.active { 
    background: var(--accent); 
    border-color: var(--accent); 
    color: #fff; 
    font-weight: 700; 
  }

  /* ---------- sections & cards ---------- */
  h2 { 
    margin: 36px 0 16px; 
    font-size: 1.8rem; 
    color: var(--accent2); 
    border-bottom: 1px solid var(--card2); 
    padding-bottom: 8px; 
    text-transform: uppercase; 
    letter-spacing: 1px; 
    display: flex; 
    align-items: baseline; 
    gap: 12px; 
    font-family: 'VT323', monospace;
    text-shadow: 0 0 5px rgba(232, 138, 26, 0.4);
  }
  h2 .count { color: var(--muted); font-size: 0.95rem; font-weight: 400; letter-spacing: 0; text-transform: none; font-family: 'Share Tech Mono', monospace; text-shadow: none; }
  
  .note { 
    background: var(--card); 
    border: 1px dashed var(--accent); 
    color: var(--text); 
    font-size: 0.95rem; 
    border-radius: 4px; 
    padding: 12px 16px; 
    margin-bottom: 16px; 
  }
  .note b { color: var(--accent2); }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  
  .card { 
    background: var(--card); 
    border: 1px solid var(--card2); 
    border-radius: 4px; 
    padding: 16px 18px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(184, 62, 62, 0.15);
  }
  .card.disabled { opacity: 0.5; filter: grayscale(100%); }
  .card.disabled:hover { border-color: var(--card2); box-shadow: none; }
  
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .name { 
    font-weight: 700; 
    font-size: 1.1rem;
    cursor: pointer;
    color: #ffffff; 
    user-select: none; 
    word-break: break-word; 
  }
  .name:hover, .name:focus { color: var(--accent2); outline: none; }
  .name.copied { color: var(--accent2); }
  .card.disabled .name { cursor: default; }
  .card.disabled .name:hover { color: #ffffff; }
  
  .cost { color: var(--accent2); font-weight: 700; white-space: nowrap; font-size: 1rem; }
  .cost.free { color: var(--accent); }
  
  .desc { color: var(--text); font-size: 1rem; line-height: 1.5; margin-bottom: 12px; }
  
  .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; align-items: center; }
  .badge { padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; font-size: 0.75rem; }
  .b-new { background: var(--accent2); color: var(--bg); }
  .b-updated { background: var(--accent); color: #fff; }
  .b-disabled { background: var(--muted); color: var(--bg); }
  .b-mod { background: var(--amber); color: var(--bg); }
  .b-off { background: var(--card2); color: var(--text); }
  .b-vip { background: var(--accent2); color: var(--bg); }
  .b-broadcaster { background: var(--text); color: var(--bg); }
  .cool { background: var(--card2); color: #fff; padding: 2px 8px; border-radius: 4px; }
  
  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 1.1rem; }

  /* ---------- changelog & footer ---------- */
  .change { background: var(--card); border: 1px solid var(--card2); border-radius: 4px; padding: 16px 20px; }
  .change li { margin-left: 20px; color: var(--text); margin-top: 6px; font-size: 1rem; }
  .change .date { color: var(--accent2); font-weight: 700; }
  
  footer { text-align: center; color: var(--muted); font-size: 0.95rem; margin-top: 56px; line-height: 2; }
  footer b { color: var(--accent2); }

  /* ---------- Mobile Optimizations ---------- */
  @media (max-width: 650px) {
    .wrap { padding: 16px 12px 60px; }
    header { padding: 24px 0 12px; }
    header h1 { font-size: 2.5rem; }
    .links { gap: 8px; margin-top: 12px; }
    .links a { padding: 4px 12px; font-size: 0.9rem; }
    .intro { padding: 16px; font-size: 0.95rem; margin-top: 16px; }
    
    .controls { padding: 12px 0 10px; margin-top: 16px; }
    #search { padding: 10px 12px; font-size: 1rem; }
    
    /* Horizontal scrolling for category chips on mobile */
    .chips { 
      flex-wrap: nowrap; 
      overflow-x: auto; 
      padding-bottom: 6px; 
      -webkit-overflow-scrolling: touch; 
      scrollbar-width: none; /* Firefox */
    }
    .chips::-webkit-scrollbar { display: none; } /* Chrome/Safari */
    .chip { flex-shrink: 0; padding: 6px 12px; font-size: 0.85rem; }

    h2 { margin: 28px 0 12px; font-size: 1.6rem; }
    
    /* Force single-column layout */
    .grid { grid-template-columns: 1fr; gap: 10px; }
    
    .card { padding: 14px; }
    .name { font-size: 1.05rem; }
    .desc { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="updated" id="updated"></div>
    <div class="links" id="links"></div>
    <div class="intro" id="intro" style="display:none"></div>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="Search commands...  (press /)" autocomplete="off" spellcheck="false">
    <div class="chips" id="chips"></div>
  </div>

  <main id="menu"></main>
  <p class="empty hidden" id="empty">No commands found. Try fewer letters, gremlin.</p>

  <h2>Recent Updates</h2>
  <div class="change"><ul id="changelog"></ul></div>

  <footer>
    Type <b>!c</b> or <b>!command</b> in chat for the quick version<br>
    No backend • No trackers • Edit <b>data.js</b> • Time to Gamer bruhmane
  </footer>
</div>

<script src="data.js?v=3"></script>
<script>
const data = window.MENU;
const menuEl = document.getElementById('menu');
const searchEl = document.getElementById('search');
const emptyEl = document.getElementById('empty');

/* ---------- header ---------- */
document.getElementById('title').innerHTML =
  `${data.streamer}'s <span>Stream Menu</span><span class="cursor">_</span>`;
document.title = `${data.streamer} — Stream Menu`;
document.getElementById('updated').textContent = `Last updated: ${data.updated}`;

(data.links || []).forEach(l => {
  const a = document.createElement('a');
  a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = l.label;
  document.getElementById('links').appendChild(a);
});

if (data.intro) {
  const el = document.getElementById('intro');
  el.innerHTML = data.intro;
  el.style.display = 'block';
}

/* ---------- chips ---------- */
let activeSection = "All";
const chipsEl = document.getElementById('chips');
["All", ...data.sections.map(s => s.name)].forEach(name => {
  const b = document.createElement('button');
  b.className = 'chip' + (name === "All" ? ' active' : '');
  b.textContent = name;
  b.dataset.filter = name;
  b.onclick = () => {
    activeSection = name;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === name));
    render();
  };
  chipsEl.appendChild(b);
});

/* ---------- badges: auto-detect type from the description ---------- */
function badge(it) {
  if (it.status === 'new')      return '<span class="badge b-new">New</span>';
  if (it.status === 'updated')  return '<span class="badge b-updated">Updated</span>';
  if (it.status === 'disabled') {
    const d = (it.desc || '').toLowerCase();
    if (d.includes('broadcaster')) return '<span class="badge b-broadcaster">Broadcaster</span>';
    if (d.includes('mod'))         return '<span class="badge b-mod">Mod Only</span>';
    if (d.includes('vip'))         return '<span class="badge b-vip">VIP+</span>';
    if (d.includes('offline'))     return '<span class="badge b-off">Offline</span>';
    return '<span class="badge b-disabled">Soon™</span>';
  }
  return '';
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  menuEl.innerHTML = '';
  let visible = 0;

  data.sections.forEach(sec => {
    if (activeSection !== "All" && sec.name !== activeSection) return;
    const items = (sec.items || []).filter(it =>
      !q || it.name.toLowerCase().includes(q) || (it.desc || '').toLowerCase().includes(q));
    if (!items.length) return;

    const h = document.createElement('h2');
    h.innerHTML = `${sec.name} <span class="count">${items.length}</span>`;
    menuEl.appendChild(h);

    if (sec.note) {
      const n = document.createElement('div');
      n.className = 'note';
      n.innerHTML = sec.note;
      menuEl.appendChild(n);
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(it => {
      const costStr = String(it.cost);
      const isFree = costStr.toUpperCase() === 'FREE';
      const copyCmd = it.name.split(/[\s\/]/)[0];
      const card = document.createElement('div');
      card.className = 'card' + (it.status === 'disabled' ? ' disabled' : '');
      card.innerHTML = `<div class="card-top"><span class="name" role="button" tabindex="0" data-copy="${copyCmd}" title="Click to copy ${copyCmd}">${it.name}</span><span class="cost${isFree ? ' free' : ''}">${isFree ? '' : '🎃 '}${costStr}</span></div>
        <div class="desc">${it.desc || ''}</div>
        <div class="meta">${badge(it)}${it.cooldown ? `<span class="cool">⏱ ${it.cooldown}</span>` : ''}</div>`;
      grid.appendChild(card);
      visible++;
    });
    menuEl.appendChild(grid);
  });

  emptyEl.classList.toggle('hidden', visible > 0);
}
render();
searchEl.addEventListener('input', render);

/* ---------- click-to-copy (event delegation) ---------- */
menuEl.addEventListener('click', e => {
  const el = e.target.closest('.name');
  if (!el || el.closest('.card.disabled') || el.classList.contains('copied')) return;

  const original = el.textContent;
  copyText(el.dataset.copy).then(() => {
    el.textContent = 'Copied! ✓';
    el.classList.add('copied');
    setTimeout(() => { el.textContent = original; el.classList.remove('copied'); }, 1200);
  }).catch(() => {
    el.textContent = 'Copy failed :(';
    el.classList.add('copied');
    setTimeout(() => { el.textContent = original; el.classList.remove('copied'); }, 1200);
  });
});

/* ---------- keyboard support for copying ---------- */
menuEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const el = e.target.closest('.name');
    if (!el || el.closest('.card.disabled')) return;
    e.preventDefault();
    el.click(); // Triggers the click-to-copy logic above
  }
});

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
}

/* ---------- keyboard: "/" focuses search, Esc clears ---------- */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
});
searchEl.addEventListener('keydown', e => {
  if (e.key === 'Escape' && searchEl.value) { searchEl.value = ''; render(); }
});

/* ---------- changelog ---------- */
const cl = document.getElementById('changelog');
(data.changelog || []).forEach(c => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="date">${c.date}</span> — ${c.text}`;
  cl.appendChild(li);
});
</script>
</body>
</html>
