<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Menu</title>
<style>
  :root {
    --bg: #040604;        /* Ink */
    --card: #0C600A;      /* Deep */
    --card2: #596B0A;     /* Olive */
    --text: #E2EAD4;      /* Bone */
    --muted: #647C54;     /* Sage */
    --accent: #2BA61E;    /* Green */
    --accent2: #CCCD25;   /* Chartreuse */
    --amber: #946606;     /* Amber */
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--bg);
    background-image:radial-gradient(800px 420px at 50% -120px, rgba(43,166,30,.10), transparent 70%);
    color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  .hidden { display:none !important; }

  /* ---------- header ---------- */
  header { text-align:center; padding:36px 0 8px; }
  header h1 { font-size:clamp(1.6rem, 4vw, 2.2rem); letter-spacing:.5px; }
  header h1 span { color:var(--accent2); }
  .cursor { color:var(--accent2); animation:blink 1.1s steps(1) infinite; font-weight:700; }
  @keyframes blink { 50% { opacity:0; } }
  .updated { color:var(--muted); font-size:.85rem; margin-top:6px; }
  .links { margin-top:14px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .links a { color:var(--accent2); text-decoration:none; font-size:.85rem; font-weight:bold;
    border:1px solid var(--accent2); padding:4px 12px; border-radius:6px; transition:all .2s; }
  .links a:hover { background:var(--accent2); color:var(--bg); box-shadow:0 0 14px rgba(204,205,37,.35); }
  .intro { background:var(--card); border:1px solid var(--muted); border-left:4px solid var(--amber);
    border-radius:10px; padding:14px 16px; margin-top:18px; font-size:.95rem; text-align:left; }
  .intro b { color:var(--accent2); }

  /* ---------- controls ---------- */
  .controls { position:sticky; top:0; z-index:10; padding:14px 0 12px;
    background:rgba(4,6,4,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--card2); }
  #search { width:100%; padding:10px 14px; border-radius:8px; border:1px solid var(--muted);
    background:var(--card); color:var(--text); font-size:1rem; }
  #search::placeholder { color:var(--muted); }
  #search:focus { outline:2px solid var(--accent2); outline-offset:-1px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { padding:5px 12px; border-radius:999px; border:1px solid var(--card2); background:var(--card);
    color:var(--muted); cursor:pointer; font-size:.85rem; transition:all .15s; }
  .chip:hover { color:var(--text); border-color:var(--accent2); }
  .chip.active { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:bold; }

  /* ---------- sections & cards ---------- */
  h2 { margin:30px 0 12px; font-size:1.1rem; color:var(--accent); border-bottom:1px solid var(--card2);
    padding-bottom:6px; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:baseline; gap:10px; }
  h2 .count { color:var(--muted); font-size:.75rem; font-weight:400; letter-spacing:0; text-transform:none; }
  .note { background:var(--bg); border:1px dashed var(--muted); color:var(--text); font-size:.85rem;
    border-radius:8px; padding:10px 12px; margin:-2px 0 12px; }
  .note b { color:var(--accent2); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--card2); border-radius:10px; padding:14px 16px;
    transition:transform .12s, border-color .12s, box-shadow .12s; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 4px 18px rgba(0,0,0,.45); }
  .card.disabled { opacity:.45; filter:grayscale(80%); }
  .card.disabled:hover { transform:none; border-color:var(--card2); box-shadow:none; }
  .card-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .name { font-family:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace; font-weight:600; cursor:pointer;
    color:var(--text); user-select:none; word-break:break-word; transition:color .15s, text-shadow .15s; }
  .name:hover { color:var(--accent2); text-shadow:0 0 10px rgba(204,205,37,.45); }
  .name.copied { color:var(--accent2); text-shadow:0 0 10px rgba(204,205,37,.6); }
  .card.disabled .name { cursor:default; }
  .card.disabled .name:hover { color:var(--text); text-shadow:none; }
  .cost { color:var(--accent2); font-weight:600; white-space:nowrap; font-size:.9rem; }
  .cost.free { color:var(--accent); }
  .desc { color:var(--muted); font-size:.9rem; margin-top:6px; }
  .meta { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; font-size:.75rem; align-items:center; }
  .badge { padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.4px; font-weight:700; }
  .b-new { background:var(--accent); color:var(--bg); }
  .b-updated { background:var(--amber); color:var(--text); }
  .b-disabled { background:var(--muted); color:var(--bg); }
  .cool { background:var(--card2); color:var(--text); padding:2px 8px; border-radius:999px; }
  .empty { text-align:center; color:var(--muted); padding:48px 0; font-size:.95rem; }

  /* ---------- changelog & footer ---------- */
  .change { background:var(--card); border:1px solid var(--card2); border-radius:10px; padding:14px 16px; }
  .change li { margin-left:18px; color:var(--muted); margin-top:4px; font-size:.9rem; }
  .change .date { color:var(--text); font-weight:600; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:48px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="updated" id="updated"></div>
    <div class="links" id="links"></div>
    <div class="intro" id="intro" style="display:none"></div>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="Search commands...  (press /)" autocomplete="off" spellcheck="false">
    <div class="chips" id="chips"></div>
  </div>

  <main id="menu"></main>
  <p class="empty hidden" id="empty">No commands found. Try fewer letters, gremlin.</p>

  <h2>Recent Updates</h2>
  <div class="change"><ul id="changelog"></ul></div>

  <footer>
    Type <b>!c</b> or <b>!command</b> in chat for the quick version<br>
    No backend • No trackers • Edit <b>data.js</b> Time to Gamer bruhmane
  </footer>
</div>

<script src="data.js"></script>
<script>
const data = window.MENU;
const menuEl = document.getElementById('menu');
const searchEl = document.getElementById('search');
const emptyEl = document.getElementById('empty');

/* ---------- header ---------- */
document.getElementById('title').innerHTML =
  `${data.streamer}'s <span>Stream Menu</span><span class="cursor">_</span>`;
document.title = `${data.streamer} — Stream Menu`;
document.getElementById('updated').textContent = `Last updated: ${data.updated}`;

(data.links || []).forEach(l => {
  const a = document.createElement('a');
  a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = l.label;
  document.getElementById('links').appendChild(a);
});

if (data.intro) {
  const el = document.getElementById('intro');
  el.innerHTML = data.intro;
  el.style.display = 'block';
}

/* ---------- chips ---------- */
let activeSection = "All";
const chipsEl = document.getElementById('chips');
["All", ...data.sections.map(s => s.name)].forEach(name => {
  const b = document.createElement('button');
  b.className = 'chip' + (name === "All" ? ' active' : '');
  b.textContent = name;
  b.dataset.filter = name;
  b.onclick = () => {
    activeSection = name;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === name));
    render();
  };
  chipsEl.appendChild(b);
});

/* ---------- render ---------- */
function badge(s) {
  if (s === 'new')      return '<span class="badge b-new">New</span>';
  if (s === 'updated')  return '<span class="badge b-updated">Updated</span>';
  if (s === 'disabled') return '<span class="badge b-disabled">Soon™</span>';
  return '';
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  menuEl.innerHTML = '';
  let visible = 0;

  data.sections.forEach(sec => {
    if (activeSection !== "All" && sec.name !== activeSection) return;
    const items = (sec.items || []).filter(it =>
      !q || it.name.toLowerCase().includes(q) || (it.desc || '').toLowerCase().includes(q));
    if (!items.length) return;

    const h = document.createElement('h2');
    h.innerHTML = `${sec.name} <span class="count">${items.length}</span>`;
    menuEl.appendChild(h);

    if (sec.note) {
      const n = document.createElement('div');
      n.className = 'note';
      n.innerHTML = sec.note;
      menuEl.appendChild(n);
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(it => {
      const costStr = String(it.cost);
      const isFree = costStr.toUpperCase() === 'FREE';
      /* "!sr ID/Title" -> "!sr" | "!fire A3" -> "!fire" */
      const copyCmd = it.name.split(/[\s\/]/)[0];
      const card = document.createElement('div');
      card.className = 'card' + (it.status === 'disabled' ? ' disabled' : '');
      card.innerHTML = `<div class="card-top"><span class="name" data-copy="${copyCmd}" title="Click to copy ${copyCmd}">${it.name}</span><span class="cost${isFree ? ' free' : ''}">${isFree ? '' : '🥚 '}${costStr}</span></div>
        <div class="desc">${it.desc || ''}</div>
        <div class="meta">${badge(it.status)}${it.cooldown ? `<span class="cool">⏱ ${it.cooldown}</span>` : ''}</div>`;
      grid.appendChild(card);
      visible++;
    });
    menuEl.appendChild(grid);
  });

  emptyEl.classList.toggle('hidden', visible > 0);
}
render();
searchEl.addEventListener('input', render);

/* ---------- click-to-copy (event delegation) ---------- */
menuEl.addEventListener('click', e => {
  const el = e.target.closest('.name');
  if (!el || el.closest('.card.disabled') || el.classList.contains('copied')) return;

  const original = el.textContent;
  copyText(el.dataset.copy).then(() => {
    el.textContent = 'Copied! ✓';
    el.classList.add('copied');
    setTimeout(() => { el.textContent = original; el.classList.remove('copied'); }, 1200);
  }).catch(() => {
    el.textContent = 'Copy failed :(';
    el.classList.add('copied');
    setTimeout(() => { el.textContent = original; el.classList.remove('copied'); }, 1200);
  });
});

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  /* fallback for file:// preview */
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
}

/* ---------- keyboard: "/" focuses search, Esc clears ---------- */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
});
searchEl.addEventListener('keydown', e => {
  if (e.key === 'Escape' && searchEl.value) { searchEl.value = ''; render(); }
});

/* ---------- changelog ---------- */
const cl = document.getElementById('changelog');
(data.changelog || []).forEach(c => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="date">${c.date}</span> — ${c.text}`;
  cl.appendChild(li);
});
</script>
</body>
</html>
